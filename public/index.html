<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spawnground — Live Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header>
      <div class="logo">
        <div class="logo-globe"></div>
        <h1>Spawnground</h1>
        <span class="version">v0.2</span>
      </div>
      <div id="auth-area">
        <a id="login-btn" class="login-btn hidden" href="/auth/github">
          <svg viewBox="0 0 16 16" width="16" height="16" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
          Login with GitHub
        </a>
        <div id="user-info" class="user-info hidden">
          <img id="user-avatar" class="user-avatar" src="" alt="">
          <span id="user-name" class="user-name"></span>
        </div>
      </div>
      <div id="tick-info">
        <div class="stat-chip">
          <span class="stat-icon">⏱</span>
          <span id="tick-counter">0</span>
          <span class="stat-label">tick</span>
        </div>
        <div class="stat-chip">
          <span class="stat-icon">🤖</span>
          <span id="agent-count">0</span>
          <span class="stat-label">agents</span>
        </div>
        <div class="stat-chip">
          <span class="stat-icon">👥</span>
          <span id="player-count">0</span>
          <span class="stat-label">players</span>
        </div>
        <div class="stat-chip">
          <span class="stat-icon">🗺️</span>
          <span id="world-size">?</span>
          <span class="stat-label">world</span>
        </div>
        <div class="stat-chip">
          <span class="stat-icon">📦</span>
          <span id="chunks-loaded">0</span>
          <span class="stat-label">chunks</span>
        </div>
        <div class="stat-chip" id="connection-chip">
          <span class="pulse-dot"></span>
          <span id="connection-status">Connecting</span>
        </div>
      </div>
    </header>

    <main>
      <div id="canvas-container">
        <canvas id="world-canvas"></canvas>
        <div id="tooltip" class="hidden"></div>
        <div id="zoom-controls">
          <button id="zoom-in">+</button>
          <button id="zoom-reset">⊙</button>
          <button id="zoom-out">−</button>
        </div>
      </div>

      <aside id="sidebar">
        <section id="minimap-section" class="panel" style="flex:0 0 auto; padding:10px;">
          <div class="panel-header"><h3>🗺️ World Map</h3></div>
          <canvas id="minimap-canvas" width="260" height="260" style="width:100%;border-radius:6px;cursor:pointer;background:#0a0a1a;border:1px solid #1a1a3e;"></canvas>
        </section>

        <section id="leaderboard-section" class="panel">
          <div class="panel-header">
            <h3>🏆 Leaderboard</h3>
          </div>
          <div id="leaderboard-list"></div>
        </section>

        <section id="agents-section" class="panel">
          <div class="panel-header">
            <h3>🤖 Active Agents</h3>
          </div>
          <div id="agents-list"></div>
        </section>

        <section id="events-section" class="panel">
          <div class="panel-header">
            <h3>📡 Live Feed</h3>
          </div>
          <div id="events-list"></div>
        </section>
      </aside>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
